<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131416">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Звернення щодо виробу</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#131416; --card:#1D1F22; --card2:#26292C; --line:#363A3E;
    --ink:#EEEFF0; --muted:#9BA1A6;
    --red:#D62D25; --red-press:#B5231D; --red-soft:#3A1917; --red-text:#FF8F87;
    --err:#FF8F87;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#F0F8F1; --card:#FFFFFF; --card2:#E3F1E4; --line:#C7E3C9;
    --ink:#173319; --muted:#5E7360;
    --red:#2E7D32; --red-press:#1F5E23; --red-soft:#DCEEDD; --red-text:#1F5E23;
    --err:#C62828;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:18px;line-height:1.35}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom))}
  header{padding:14px 0 10px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .title{font-weight:700;font-size:20px}
  .serial{margin-top:2px;color:var(--muted);font-size:15px}
  .serial b{color:var(--ink);letter-spacing:.5px}
  .status{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;
    background:var(--card2);color:var(--muted);white-space:nowrap}
  .pill.off{background:var(--red-soft);color:var(--red-text)}
  .bar{height:6px;background:var(--line);border-radius:99px;margin:12px 0 4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--red);width:0;transition:width .25s}
  main{flex:1;padding-top:14px}
  h1{font-size:26px;line-height:1.2;margin:0 0 16px}
  .opts{display:grid;gap:10px}
  .opt{width:100%;text-align:left;font:inherit;font-size:19px;font-weight:600;
    background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;
    padding:16px;min-height:60px;cursor:pointer}
  .opt small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
  .opt:active{background:var(--card2);border-color:var(--red)}
  .opt.sel{background:var(--red);border-color:var(--red);color:#fff}
  .opt.sel small{color:rgba(255,255,255,.78)}
  .opt.danger{border-left:6px solid var(--red)}
  .back{margin-top:16px;background:none;border:none;font:inherit;font-size:16px;
    color:var(--muted);padding:12px 4px;cursor:pointer;text-decoration:underline}
  label{display:block;font-weight:600;margin:16px 0 6px}
  .hint{font-weight:400;color:var(--muted);font-size:14px}
  input[type=text],textarea{width:100%;font:inherit;font-size:18px;padding:14px;
    border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
  input::placeholder,textarea::placeholder{color:#6B7176}
  textarea{min-height:130px;resize:vertical}
  .count{text-align:right;color:var(--muted);font-size:13px;margin-top:4px}
  input:focus,textarea:focus{outline:none;border-color:var(--red)}
  button:focus-visible{outline:3px solid var(--red-text);outline-offset:2px}
  .summary{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 14px}
  .summary div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:16px}
  .summary div:last-child{border-bottom:none}
  .summary span{color:var(--muted);flex:none}
  .summary b{text-align:right;overflow-wrap:anywhere}
  .primary{width:100%;margin-top:18px;font:inherit;font-size:21px;font-weight:700;
    background:var(--red);color:#fff;border:none;border-radius:14px;padding:18px;cursor:pointer}
  .primary:active{background:var(--red-press)}
  .primary:disabled{opacity:.5}
  .photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .photo img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
  .filebtn{display:inline-block;font-weight:600;border:2px solid var(--red);color:var(--red-text);
    border-radius:12px;padding:12px 16px;cursor:pointer}
  .filebtn input{display:none}
  .done{text-align:center;padding-top:30px}
  .done .mark{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
    font-size:44px;background:var(--ink);color:var(--bg)}
  .done .mark.wait{background:var(--red-soft);color:var(--red-text);border:3px solid var(--red)}
  .done p{color:var(--muted);margin:8px 0}
  .reply{background:var(--card2);border-left:5px solid var(--red);border-radius:12px;
    padding:14px;margin:16px 0;font-weight:600;text-align:left}
  .err{color:var(--err);font-size:15px;margin-top:8px}
  .setup{background:var(--red-soft);color:var(--red-text);border-radius:12px;padding:10px 12px;
    font-size:14px;margin-top:14px}
  .themeToggle{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;
    cursor:pointer;flex:none;background:conic-gradient(var(--card) 0 50%, var(--red) 50% 100%)}
  .themeToggle:active{border-color:var(--red)}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div>
        <div class="title">Звернення щодо виробу</div>
        <div class="serial" id="serialLine"></div>
      </div>
      <div class="status">
        <button class="themeToggle" id="themeToggle" type="button" aria-label="Змінити колірну тему" title="Змінити колірну тему"></button>
        <span class="pill" id="netPill">Є мережа</span>
      </div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </header>
  <main id="view"></main>
</div>

<script>
/* ============ НАЛАШТУВАННЯ (єдине місце, яке треба змінити) ============ */
const CONFIG = {
  // Адреса Production URL з вузла Webhook у n8n. Приклад: "https://xxxx.trycloudflare.com/webhook/feedback"
  WEBHOOK_URL: "ВСТАВТЕ_СЮДИ_АДРЕСУ_WEBHOOK_З_N8N",
  TIMEOUT_MS: 8000
};
/* ======================================================================= */

const NODES = [
  {v:'power',    l:'Живлення',            s:'акумулятор, зарядка, перегрів'},
  {v:'comms',    l:'Зв\u2019язок',        s:'сигнал, з\u2019єднання з пультом'},
  {v:'body',     l:'Корпус і механіка',   s:'тріщини, люфт, деформація'},
  {v:'software', l:'Програма / прошивка', s:'запуск, оновлення, налаштування'},
  {v:'kit',      l:'Комплектність',       s:'чогось не вистачає'},
  {v:'other',    l:'Інше',                s:'опишіть своїми словами'}
];
const SYMPTOMS = {
  power:[{v:'no_power_on',l:'Не вмикається'},{v:'drains_fast',l:'Швидко розряджається'},
         {v:'not_charging',l:'Не заряджається'},{v:'overheats',l:'Перегрівається'},
         {v:'shuts_off',l:'Вимикається сам'}],
  comms:[{v:'no_signal',l:'Немає сигналу'},{v:'unstable',l:'Нестабільний зв\u2019язок'},
         {v:'no_pair',l:'Не з\u2019єднується з пультом'}],
  body:[{v:'crack',l:'Тріщина'},{v:'play',l:'Люфт'},{v:'deformed',l:'Деформація'},
        {v:'transport_damage',l:'Пошкоджено при транспортуванні'}],
  software:[{v:'boot_error',l:'Помилка при запуску'},{v:'no_update',l:'Не оновлюється'},
            {v:'settings_lost',l:'Збиваються налаштування'}],
  kit:[{v:'part_missing',l:'Не вистачає деталі'},{v:'wrong_kit',l:'Не та комплектація'},
       {v:'no_docs',l:'Немає інструкції'}],
  other:[{v:'other',l:'Опис у коментарі'}]
};
const WHEN = [
  {v:'on_receipt',l:'При отриманні'},{v:'on_check',l:'При перевірці'},
  {v:'after_storage',l:'Після зберігання'},{v:'after_transport',l:'Після транспортування'}
];
const SEVERITY = [
  {v:'unusable',l:'Виріб непридатний',danger:true},
  {v:'limited',l:'Працює з обмеженнями'},
  {v:'minor',l:'Дрібна вада'}
];
const REPEAT = [{v:'always',l:'Завжди'},{v:'sometimes',l:'Іноді'},{v:'once',l:'Один раз'}];

const QKEY = 'fb_queue_v1', UKEY = 'fb_unit_v1', TKEY = 'fb_theme_v1', SKEY = 'fb_submits_v1';
const DAY_MS = 24*60*60*1000, DAILY_LIMIT = 5;
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const view = $('view');

let state, step = 0, lastResult = null;

function freshState(){
  let unit = params.get('unit') || '';
  try { if (!unit) unit = localStorage.getItem(UKEY) || ''; } catch(e){}
  return {code:(params.get('id')||'').trim(), unit, node:'', symptom:'', when:'',
          severity:'', repeat:'', comment:'', photo:''};
}
state = freshState();

/* ---- кроки: для "Інше" замість "Що саме?" одразу відкривається опис ---- */
function steps(){
  const s = [];
  if (!state.code) s.push('code');
  s.push('node');
  s.push(state.node === 'other' ? 'describe' : 'symptom');
  s.push('when','severity','repeat','final');
  return s;
}
const label = (list, v) => (list.find(o=>o.v===v)||{}).l || '';
function esc(t){ return String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function optionsHtml(list, key){
  return '<div class="opts">' + list.map(o =>
    `<button class="opt ${o.danger?'danger':''} ${state[key]===o.v?'sel':''}" data-key="${key}" data-v="${o.v}">
       ${esc(o.l)}${o.s?`<small>${esc(o.s)}</small>`:''}</button>`).join('') + '</div>';
}

function render(){
  const list = steps();
  const name = list[step];
  $('barFill').style.width = Math.round((step/(list.length-1))*100) + '%';
  $('serialLine').innerHTML = state.code ? `Виріб <b>${esc(state.code)}</b>` : '';
  let html = '';
  const back = step>0 ? '<button class="back" id="backBtn">← Назад</button>' : '';
  const isOther = state.node === 'other';

  if (name==='code'){
    html = `<h1>Код виробу</h1>
      <p class="hint">Він надрукований поруч із QR-кодом, наприклад A7K-2941.</p>
      <input type="text" id="codeInput" autocapitalize="characters" autocomplete="off" placeholder="A7K-2941" value="${esc(state.code)}">
      <div class="err" id="codeErr"></div>
      <button class="primary" id="codeNext">Далі</button>`;
  } else if (name==='node'){
    html = `<h1>Що сталося з виробом?</h1>` + optionsHtml(NODES,'node') + back;
  } else if (name==='describe'){
    html = `<h1>Опишіть, що сталося</h1>
      <p class="hint">Лише про стан виробу. Без місця й обставин застосування.</p>
      <textarea id="describeBox" maxlength="300" placeholder="Наприклад: після ввімкнення блимає індикатор і виріб вимикається">${esc(state.comment)}</textarea>
      <div class="count" id="count"></div>
      <div class="err" id="descErr"></div>
      <button class="primary" id="descNext">Далі</button>${back}`;
  } else if (name==='symptom'){
    html = `<h1>Що саме?</h1>` + optionsHtml(SYMPTOMS[state.node]||SYMPTOMS.other,'symptom') + back;
  } else if (name==='when'){
    html = `<h1>Коли помітили?</h1>` + optionsHtml(WHEN,'when') + back;
  } else if (name==='severity'){
    html = `<h1>Наскільки серйозно?</h1>` + optionsHtml(SEVERITY,'severity') + back;
  } else if (name==='repeat'){
    html = `<h1>Це повторюється?</h1>` + optionsHtml(REPEAT,'repeat') + back;
  } else if (name==='final'){
    html = `<h1>Перевірте й відправте</h1>
      <div class="summary">
        <div><span>Вузол</span><b>${esc(label(NODES,state.node))}</b></div>
        ${isOther
          ? `<div><span>Опис</span><b>${esc(state.comment)}</b></div>`
          : `<div><span>Що саме</span><b>${esc(label(SYMPTOMS[state.node]||[],state.symptom))}</b></div>`}
        <div><span>Коли</span><b>${esc(label(WHEN,state.when))}</b></div>
        <div><span>Серйозність</span><b>${esc(label(SEVERITY,state.severity))}</b></div>
        <div><span>Повторюється</span><b>${esc(label(REPEAT,state.repeat))}</b></div>
      </div>
      <label>Фото <span class="hint">(необов\u2019язково)</span></label>
      <div class="photo">
        <label class="filebtn" style="margin:0">Зробити фото
          <input type="file" id="photoInput" accept="image/*" capture="environment"></label>
        ${state.photo?`<img src="${state.photo}" alt="Фото виробу">`:''}
      </div>
      ${isOther ? '' : `<label>Коментар <span class="hint">(необов\u2019язково, до 200 символів; лише про стан виробу)</span></label>
      <textarea id="comment" maxlength="200">${esc(state.comment)}</textarea>`}
      ${state.unit?'':`<label>Код підрозділу</label><input type="text" id="unitInput" autocomplete="off" placeholder="напр. U-114">`}
      <div class="err" id="sendErr"></div>
      <button class="primary" id="sendBtn">Відправити</button>${back}`;
  }
  if (!isConfigured()) html += `<div class="setup">Адресу n8n ще не вставлено: звернення зберігаються в телефоні, але не відправляються.</div>`;
  view.innerHTML = html;
  window.scrollTo(0,0);
  bind(name);
}

function bind(name){
  view.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const k = b.dataset.key, v = b.dataset.v;
    if (k==='node'){
      const wasOther = state.node === 'other';
      state.node = v;
      state.symptom = (v==='other') ? 'other' : '';
      if (wasOther && v!=='other') state.comment = '';   // опис із "Інше" не тягнемо в інші вузли
    } else state[k] = v;
    step++; render();
  });
  const bk = $('backBtn'); if (bk) bk.onclick = () => { step--; render(); };

  if (name==='code'){
    $('codeNext').onclick = () => {
      const v = $('codeInput').value.trim().toUpperCase();
      if (v.length < 4){ $('codeErr').textContent = 'Введіть код повністю'; return; }
      state.code = v; step = 0; render();
    };
  }
  if (name==='describe'){
    const box = $('describeBox'), cnt = $('count');
    const upd = () => { state.comment = box.value; cnt.textContent = box.value.length + ' / 300'; };
    box.oninput = upd; upd();
    setTimeout(() => box.focus(), 50);                 // одразу відкриваємо клавіатуру
    $('descNext').onclick = () => {
      if (box.value.trim().length < 3){ $('descErr').textContent = 'Напишіть кілька слів про проблему'; return; }
      state.comment = box.value.trim(); step++; render();
    };
  }
  if (name==='final'){
    const c = $('comment'); if (c) c.oninput = e => state.comment = e.target.value;
    $('photoInput').onchange = onPhoto;
    $('sendBtn').onclick = onSend;
  }
}

/* ---- фото: стискаємо до ~800px ---- */
function onPhoto(e){
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 800, k = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    state.photo = c.toDataURL('image/jpeg',0.6);
    URL.revokeObjectURL(img.src); render();
  };
  img.src = URL.createObjectURL(f);
}

/* ---- черга ---- */
function readQ(){ try { return JSON.parse(localStorage.getItem(QKEY)||'[]'); } catch(e){ return []; } }
function writeQ(q){ try { localStorage.setItem(QKEY, JSON.stringify(q)); return true; } catch(e){ return false; } }
function uuid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
}
function isConfigured(){ return /^https?:\/\//.test(CONFIG.WEBHOOK_URL); }

async function onSend(){
  const ui = $('unitInput');
  if (ui){ state.unit = ui.value.trim().toUpperCase(); }
  if (!state.unit){ $('sendErr').textContent = 'Вкажіть код підрозділу'; return; }
  if (submitsLeft() <= 0){ showBlocked(); return; }
  try { localStorage.setItem(UKEY, state.unit); } catch(e){}
  const report = {
    id: uuid(), ts: new Date().toISOString(),
    serial: state.code, unit: state.unit,
    node: state.node, symptom: state.symptom, when: state.when,
    severity: state.severity, repeat: state.repeat,
    comment: state.comment.trim(), photo: state.photo, app: 'pwa-2'
  };
  // 1) СПОЧАТКУ завжди зберігаємо в телефоні
  const q = readQ(); q.push(report);
  if (!writeQ(q)){
    q.pop(); report.photo = ''; q.push(report);
    if (!writeQ(q)){ $('sendErr').textContent = 'Немає місця в пам\u2019яті телефона'; return; }
  }
  recordSubmit();
  // 2) потім пробуємо відправити
  $('sendBtn').disabled = true; $('sendBtn').textContent = 'Відправляю…';
  lastResult = await flush();
  showDone();
}

let flushing = false;
async function flush(){
  if (flushing || !isConfigured()) { updateStatus(); return {sent:0,msg:''}; }
  flushing = true; let msg = '', sent = 0;
  try {
    let q = readQ();
    while (q.length){
      const item = q[0];
      const ctl = new AbortController();
      const t = setTimeout(()=>ctl.abort(), CONFIG.TIMEOUT_MS);
      let ok = false;
      try {
        const r = await fetch(CONFIG.WEBHOOK_URL, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(item), signal: ctl.signal });
        ok = r.ok;
        if (ok){ try { const j = await r.json(); if (j && j.message) msg = j.message; } catch(e){} }
      } catch(e){ ok = false; }
      clearTimeout(t);
      if (!ok) break;
      q.shift(); writeQ(q); sent++;
    }
  } finally { flushing = false; updateStatus(); }
  return {sent, msg};
}

function showDone(){
  const left = readQ().length;
  const delivered = lastResult && lastResult.sent>0 && left===0;
  $('barFill').style.width = '100%';
  view.innerHTML = `<div class="done">
      <div class="mark ${delivered?'':'wait'}">${delivered?'✓':'⏳'}</div>
      <h1>${delivered?'Відправлено':'Збережено в телефоні'}</h1>
      ${delivered
        ? (lastResult.msg?`<div class="reply">${esc(lastResult.msg)}</div>`:'<p>Дякуємо. Інженерів повідомлено.</p>')
        : '<p>Немає зв\u2019язку з сервером. Звернення відправиться саме, коли з\u2019явиться мережа. Нічого повторно натискати не треба.</p>'}
      <button class="primary" id="againBtn">Нове звернення</button>
    </div>`;
  $('againBtn').onclick = () => { state = freshState(); step = 0; enterForm(); };
}

/* ---- колірна тема ---- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta && bg) meta.setAttribute('content', bg);
}
function initTheme(){
  let t = 'dark';
  try { t = localStorage.getItem(TKEY) || 'dark'; } catch(e){}
  applyTheme(t);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = cur === 'light' ? 'dark' : 'light';
  try { localStorage.setItem(TKEY, next); } catch(e){}
  applyTheme(next);
}

/* ---- ліміт звернень: не більше DAILY_LIMIT за 24 год з одного пристрою ---- */
function readSubmits(){ try { return JSON.parse(localStorage.getItem(SKEY)||'[]'); } catch(e){ return []; } }
function pruneSubmits(list){ const cut = Date.now()-DAY_MS; return list.filter(t=>t>cut); }
function recordSubmit(){
  const list = pruneSubmits(readSubmits());
  list.push(Date.now());
  try { localStorage.setItem(SKEY, JSON.stringify(list)); } catch(e){}
}
function submitsLeft(){ return Math.max(0, DAILY_LIMIT - pruneSubmits(readSubmits()).length); }
function nextAvailableAt(){
  const list = pruneSubmits(readSubmits()).sort((a,b)=>a-b);
  return list.length ? new Date(list[0] + DAY_MS) : null;
}
function showBlocked(){
  const next = nextAvailableAt();
  const timeStr = next ? next.toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
  $('serialLine').innerHTML = state.code ? `Виріб <b>${esc(state.code)}</b>` : '';
  $('barFill').style.width = '100%';
  view.innerHTML = `<div class="done">
      <div class="mark wait">⏳</div>
      <h1>Ліміт звернень на сьогодні вичерпано</h1>
      <p>З цього пристрою вже надіслано ${DAILY_LIMIT} звернень за останню добу.</p>
      ${timeStr?`<p>Наступне звернення можна буде надіслати після ${esc(timeStr)}.</p>`:''}
    </div>`;
  window.scrollTo(0,0);
}
function enterForm(){
  if (submitsLeft() <= 0){ showBlocked(); return; }
  render();
}

/* ---- індикатори ---- */
function updateStatus(){
  const on = navigator.onLine;
  const n = $('netPill'); n.textContent = on ? 'Є мережа' : 'Без мережі'; n.className = 'pill' + (on?'':' off');
}
window.addEventListener('online', () => { updateStatus(); flush(); });
window.addEventListener('offline', updateStatus);
document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });
setInterval(() => { if (navigator.onLine && readQ().length) flush(); }, 30000);

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
initTheme();
$('themeToggle').onclick = toggleTheme;
updateStatus(); enterForm(); flush();
</script>
</body>
</html>
